name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HisnAlMuslim.apk

      # ملف معلومات التحديث: التطبيق بيقراه ليعرف لو فيه نسخة أحدث وبيعرض ملاحظاتها
      - name: Create update.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          jq -n --argjson code "$((RUN_NUMBER + 100))" --arg name "2.0" \
            --arg notes "$(printf '%s' "$NOTES" | head -n 1)" \
            --argjson size "$(stat -c%s HisnAlMuslim.apk)" \
            '{versionCode:$code, versionName:$name, notes:$notes, apk:"HisnAlMuslim.apk", size:$size}' > update.json
          cat update.json

      - uses: actions/upload-artifact@v4
        with:
          name: HisnAlMuslim-apk
          path: HisnAlMuslim.apk

      # نسخة جاهزة للتحميل في صفحة Releases (بتتحدّث مع كل push)
      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: حصن المسلم - أحدث نسخة
          body: "نسخة APK مبنية تلقائيًا من آخر تعديل (debug). فعّل «التثبيت من مصادر غير معروفة» لتثبيتها."
          files: |
            HisnAlMuslim.apk
            update.json
          prerelease: false
