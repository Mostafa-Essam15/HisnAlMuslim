name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HisnAlMuslim.apk

      # تحديث بالفرق: نحسب ملف فرق (bsdiff) بين آخر ٦ نسخ محفوظة والنسخة الجديدة، والتطبيق بيختار اللي يناسب نسخته
      - name: Build delta patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff
          mkdir -p old patches
          gh release download archive --pattern 'build-*.apk' --dir old --repo "$GITHUB_REPOSITORY" || echo "no archive yet"
          for f in $(ls old/build-*.apk 2>/dev/null | sort -V | tail -6); do
            from=$(basename "$f" .apk | sed 's/build-//')
            python3 tools/mkpatch.py "$f" HisnAlMuslim.apk "patches/patch-from-$from.bin" || rm -f "patches/patch-from-$from.bin"
          done
          ls -la patches || true

      # ملف معلومات التحديث: التطبيق بيقراه ليعرف لو فيه نسخة أحدث وبيعرض ملاحظاتها
      - name: Create update.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          PATCHES='[]'
          for f in patches/patch-from-*.bin; do
            [ -e "$f" ] || continue
            from=$(basename "$f" .bin | sed 's/patch-from-//')
            PATCHES=$(echo "$PATCHES" | jq -c --argjson from "$from" --arg file "$(basename "$f")" --argjson size "$(stat -c%s "$f")" '. + [{from:$from, file:$file, size:$size}]')
          done
          jq -n --argjson code "$((RUN_NUMBER + 100))" --arg name "2.0" \
            --arg notes "$(printf '%s' "$NOTES" | head -n 1)" \
            --argjson size "$(stat -c%s HisnAlMuslim.apk)" \
            --arg sha "$(sha256sum HisnAlMuslim.apk | cut -d' ' -f1)" \
            --argjson patches "$PATCHES" \
            '{versionCode:$code, versionName:$name, notes:$notes, apk:"HisnAlMuslim.apk", size:$size, sha256:$sha, patches:$patches}' > update.json
          cat update.json

      # نحتفظ بنسخة APK من كل بناء (آخر ٦) عشان نحسب منها فروق للبنايات الجاية
      - name: Archive this build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release view archive --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create archive --repo "$GITHUB_REPOSITORY" --title "archive" --notes "نسخ سابقة تُستخدم لحساب التحديث بالفرق (لا تُحمّلها يدويًا)" --prerelease
          cp HisnAlMuslim.apk "build-$((RUN_NUMBER + 100)).apk"
          gh release upload archive "build-$((RUN_NUMBER + 100)).apk" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view archive --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '^build-.*\.apk$' | sort -V | head -n -6 | \
            xargs -r -I{} gh release delete-asset archive {} -y --repo "$GITHUB_REPOSITORY" || true

      # نشيل ملفات الفرق القديمة من الـRelease قبل ما نرفع الجديدة
      - name: Remove stale patches from latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep '^patch-from-' | \
            xargs -r -I{} gh release delete-asset latest {} -y --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HisnAlMuslim-apk
          path: HisnAlMuslim.apk

      # نسخة جاهزة للتحميل في صفحة Releases (بتتحدّث مع كل push)
      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: حصن المسلم - أحدث نسخة
          body: "نسخة APK مبنية تلقائيًا من آخر تعديل (debug). فعّل «التثبيت من مصادر غير معروفة» لتثبيتها."
          files: |
            HisnAlMuslim.apk
            update.json
            patches/*.bin
          prerelease: false
